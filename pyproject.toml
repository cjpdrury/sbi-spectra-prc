[project]
name = "sbi-spectra-prc"
version = "0.1.0"
description = "Paper reproducibility challenge: doi.org/10.1051/0004-6361/202449214"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "sbi>=0.22.0,<0.23",
    "matplotlib>=3.8.2,<4",
    "scikit-learn>=1.3.2,<2",
    "dill>=0.3.7,<0.4",
    "click>=8.1.7,<9",
    "torch>=2.1.1,<3",
    "jax[cpu]==0.4.23",
    "ppretty>=1.3,<2",
    "jaxspec>=0.0.2,<0.0.3",
    "scipy<1.13",
]

[tool.uv.sources]
torch = [{ index = "pytorch" }]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false
